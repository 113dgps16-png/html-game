<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd Grade Tug of War: Target Words</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Open+Sans:wght@600&display=swap');

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f0f9ff;
            overflow: hidden;
            touch-action: manipulation;
        }

        .title-font {
            font-family: 'Luckiest Guy', cursive;
        }

        .rope {
            height: 14px;
            background: repeating-linear-gradient(
                45deg,
                #8b4513,
                #8b4513 10px,
                #a0522d 10px,
                #a0522d 20px
            );
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            position: relative;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .flag {
            width: 8px;
            height: 50px;
            background-color: #ff0000;
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
            border: 2px solid white;
            z-index: 10;
        }

        .character {
            font-size: 3.5rem;
            transition: all 0.3s;
            display: inline-block;
        }

        .active-team {
            animation: bounce 0.8s infinite;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.2));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            50% { transform: translateX(15px); }
            75% { transform: translateX(-15px); }
            100% { transform: translateX(0); }
        }

        .win-overlay {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .correct-flash {
            animation: flashGreen 0.5s;
        }
        
        @keyframes flashGreen {
            0% { background-color: white; }
            50% { background-color: #dcfce7; }
            100% { background-color: white; }
        }

        .animal-icon {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .timer-bar-container {
            width: 100%;
            height: 12px;
            background-color: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 10px;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background-color: #10b981;
            transition: width 0.1s linear, background-color 0.3s;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between p-4 bg-gradient-to-b from-blue-100 to-white">

    <!-- Header -->
    <div class="text-center mt-2">
        <h1 class="title-font text-6xl text-blue-600 drop-shadow-md mb-1">TUG OF WORDS!</h1>
        <p class="text-gray-500 font-bold tracking-widest uppercase">Reading Challenge</p>
    </div>

    <!-- Scores & Turn Indicator -->
    <div class="w-full max-w-5xl flex flex-col items-center">
        <div class="w-full flex justify-between items-center px-12 mb-4">
            <div id="team-left-box" class="bg-red-500 text-white p-6 rounded-3xl shadow-xl border-b-8 border-red-700 transition-all duration-300 w-64 text-center">
                <h2 class="title-font text-3xl">TEAM RED</h2>
                <p id="left-status" class="font-bold mt-1 uppercase">Your Turn!</p>
            </div>
            
            <div id="turn-indicator" class="text-7xl transition-all duration-400">
                <span id="arrow-symbol">⬅️</span>
            </div>

            <div id="team-right-box" class="bg-blue-500 text-white p-6 rounded-3xl shadow-xl border-b-8 border-blue-700 transition-all duration-300 w-64 text-center opacity-40 scale-90">
                <h2 class="title-font text-3xl">TEAM BLUE</h2>
                <p id="right-status" class="font-bold mt-1 uppercase">Waiting...</p>
            </div>
        </div>
    </div>

    <!-- The Field -->
    <div class="relative w-full max-w-6xl h-48 flex items-center justify-center">
        <div class="absolute left-20 h-full w-4 bg-red-500 rounded-full opacity-20 border-r-4 border-red-600"></div>
        <div class="absolute right-20 h-full w-4 bg-blue-500 rounded-full opacity-20 border-l-4 border-blue-600"></div>
        
        <div id="rope-container" class="w-full flex items-center justify-center transition-transform duration-700 ease-out">
            <div id="left-chars" class="flex space-x-[-25px] mr-8 active-team">
                <span class="character">🧒</span>
                <span class="character">👧</span>
                <span class="character">🧒</span>
            </div>

            <div class="rope w-3/5">
                <div class="flag"></div>
            </div>

            <div id="right-chars" class="flex space-x-[-25px] ml-8">
                <span class="character">👦</span>
                <span class="character">👧</span>
                <span class="character">👦</span>
            </div>
        </div>
    </div>

    <!-- Word Challenge Area -->
    <div id="challenge-area" class="w-full max-w-2xl bg-white rounded-[40px] p-10 shadow-2xl border-b-[12px] border-gray-200 text-center mb-6 transition-colors duration-300">
        <div class="flex justify-between items-center mb-4">
            <div id="turn-prompt" class="text-red-600 font-black uppercase tracking-widest text-2xl">
                TEAM RED: READ!
            </div>
            <div id="speed-label" class="text-xl font-bold text-gray-400">SPEED: 1x</div>
        </div>
        
        <div class="timer-bar-container">
            <div id="timer-bar"></div>
        </div>
        
        <div id="word-display" class="title-font text-8xl my-10 text-gray-800 tracking-tight transition-all duration-300">
            BROWN BEAR
        </div>

        <div id="options-grid" class="grid grid-cols-3 gap-6">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <!-- Win Overlay -->
    <div id="win-overlay" class="win-overlay fixed inset-0 z-50 flex flex-col items-center justify-center">
        <div class="bg-white p-16 rounded-[60px] shadow-2xl text-center border-b-[20px] border-gray-200">
            <h2 id="winner-text" class="title-font text-9xl mb-10">TEAM RED WINS!</h2>
            <button onclick="resetGame()" class="bg-green-500 hover:bg-green-600 text-white title-font text-5xl px-20 py-10 rounded-full shadow-2xl transform hover:scale-110 active:scale-95 transition-all">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Animal SVGs
        const icons = {
            bear: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M12 24a8 8 0 1 1 16 0 8 8 0 0 1-16 0zm24 0a8 8 0 1 1 16 0 8 8 0 0 1-16 0z"/><path fill="#fff" d="M32 16c-14 0-24 10-24 22s10 22 24 22 24-10 24-22-10-22-24-22zm0 36c-8 0-14-6-14-14s6-14 14-14 14 6 14 14-6 14-14 14z"/><circle cx="26" cy="38" r="3" fill="#333"/><circle cx="38" cy="38" r="3" fill="#333"/><path d="M32 44c-2 0-4 1-4 3s2 3 4 3 4-1 4-3-2-3-4-3z" fill="#333"/></svg>`,
            bird: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M48 16c-4 0-8 4-8 8v8h12c4 0 8-4 8-8s-4-8-12-8zm-24 8c-6 0-12 6-12 12v16h24V36c0-6-6-12-12-12z"/><path fill="#fff" d="M12 44c-4 0-8 4-8 8s4 8 8 8h40c4 0 8-4 8-8s-4-8-8-8H12z"/><path d="M52 24a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="#333"/></svg>`,
            duck: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M24 8c-6 0-10 4-10 10s4 10 10 10h4v8c0 8 6 14 14 14h12c6 0 10-4 10-10V24c0-8-8-16-18-16H24z"/><path d="M14 18l-6 2 6 2v-4z" fill="#ff9800"/><circle cx="28" cy="16" r="2" fill="#333"/></svg>`,
            horse: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M16 12l4 24h12l4-24-10 4-10-4zm16 28v16h8V40h-8zm-12 0v16h8V40h-8zm32-16c0-8-8-12-16-12v8c0 4 4 8 8 8h8z"/><circle cx="24" cy="20" r="2" fill="#333"/></svg>`,
            frog: `<svg viewBox="0 0 64 64" class="animal-icon"><ellipse cx="20" cy="20" rx="8" ry="8" fill="#fff"/><ellipse cx="44" cy="20" rx="8" ry="8" fill="#fff"/><path fill="#fff" d="M8 32c0-10 10-18 24-18s24 8 24 18-10 18-24 18-24-8-24-18z"/><circle cx="20" cy="20" r="3" fill="#333"/><circle cx="44" cy="20" r="3" fill="#333"/><path d="M24 42c2 2 14 2 16 0" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/></svg>`,
            cat: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M12 12l8 12h24l8-12-8 8H20l-8-8zm20 16c-12 0-20 8-20 20s8 12 20 12 20-4 20-12-8-20-20-20z"/><circle cx="24" cy="44" r="2" fill="#333"/><circle cx="40" cy="44" r="2" fill="#333"/><path d="M30 50l2 2 2-2h-4z" fill="#333"/></svg>`,
            dog: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M16 12c-4 0-8 6-8 12s4 12 8 12v16h32V36c4 0 8-6 8-12s-4-12-8-12H16z"/><circle cx="24" cy="24" r="3" fill="#333"/><circle cx="40" cy="24" r="3" fill="#333"/><circle cx="32" cy="30" r="3" fill="#333"/></svg>`,
            sheep: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M32 12c-12 0-20 8-20 18s4 14 8 16v10h24V46c4-2 8-6 8-16s-8-18-20-18z"/><circle cx="26" cy="30" r="3" fill="#333"/><circle cx="38" cy="30" r="3" fill="#333"/><path d="M10 24a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm44 0a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="#fff"/></svg>`,
            fish: `<svg viewBox="0 0 64 64" class="animal-icon"><path fill="#fff" d="M8 32c0-12 16-20 32-20s20 8 20 20-4 20-20 20-32-8-32-20z"/><path fill="#fff" d="M52 32l10-8v16l-10-8z"/><circle cx="20" cy="28" r="3" fill="#333"/></svg>`
        };

        const targetWords = [
            { text: "BROWN BEAR", color: "brown", hex: "#8B4513", icon: icons.bear },
            { text: "RED BIRD", color: "red", hex: "#EF4444", icon: icons.bird },
            { text: "YELLOW DUCK", color: "yellow", hex: "#FACC15", icon: icons.duck },
            { text: "BLUE HORSE", color: "blue", hex: "#3B82F6", icon: icons.horse },
            { text: "GREEN FROG", color: "green", hex: "#22C55E", icon: icons.frog },
            { text: "PURPLE CAT", color: "purple", hex: "#A855F7", icon: icons.cat },
            { text: "WHITE DOG", color: "white", hex: "#FFFFFF", icon: icons.dog },
            { text: "BLACK SHEEP", color: "black", hex: "#000000", icon: icons.sheep },
            { text: "GOLD FISH", color: "gold", hex: "#FFD700", icon: icons.fish }
        ];

        let currentTurn = 'left'; 
        let ropePosition = 0; 
        const winThreshold = 6; 
        const pullStrength = 1;
        let isProcessing = false;
        let turnCount = 0;

        // Timer Variables
        let timeLeft = 100; // Percentage
        let timerInterval;
        const initialTurnDuration = 10000; // 10 seconds
        const minTurnDuration = 2000;    // 2 seconds floor
        const reductionPerTurn = 500;   // Speed up by 0.5s each turn
        let currentTurnDuration = initialTurnDuration;

        const wordDisplay = document.getElementById('word-display');
        const optionsGrid = document.getElementById('options-grid');
        const ropeContainer = document.getElementById('rope-container');
        const teamLeftBox = document.getElementById('team-left-box');
        const teamRightBox = document.getElementById('team-right-box');
        const leftStatus = document.getElementById('left-status');
        const rightStatus = document.getElementById('right-status');
        const turnPrompt = document.getElementById('turn-prompt');
        const arrowSymbol = document.getElementById('arrow-symbol');
        const leftChars = document.getElementById('left-chars');
        const rightChars = document.getElementById('right-chars');
        const challengeArea = document.getElementById('challenge-area');
        const winOverlay = document.getElementById('win-overlay');
        const winnerText = document.getElementById('winner-text');
        const timerBar = document.getElementById('timer-bar');
        const speedLabel = document.getElementById('speed-label');

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 100;
            updateTimerBar();
            
            const step = 50; // Update every 50ms for smoothness
            const decrement = (step / currentTurnDuration) * 100;
            
            // Calculate speed multiplier display
            const speedMult = (initialTurnDuration / currentTurnDuration).toFixed(1);
            speedLabel.innerText = `SPEED: ${speedMult}x`;
            
            timerInterval = setInterval(() => {
                if (isProcessing) return; 
                
                timeLeft -= decrement;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
                updateTimerBar();
            }, step);
        }

        function updateTimerBar() {
            timerBar.style.width = `${timeLeft}%`;
            if (timeLeft > 50) timerBar.style.backgroundColor = '#10b981';
            else if (timeLeft > 25) timerBar.style.backgroundColor = '#f59e0b';
            else timerBar.style.backgroundColor = '#ef4444';
        }

        function handleTimeOut() {
            isProcessing = true;
            challengeArea.classList.add('shake');
            wordDisplay.innerText = "TIME'S UP!";
            wordDisplay.style.color = "#94a3b8";
            
            setTimeout(() => {
                challengeArea.classList.remove('shake');
                wordDisplay.style.color = "#1f2937";
                swapTurn();
            }, 1200);
        }

        function initRound() {
            isProcessing = false;
            const wordObj = targetWords[Math.floor(Math.random() * targetWords.length)];
            wordDisplay.innerText = wordObj.text;
            wordDisplay.style.opacity = "1";
            wordDisplay.style.transform = "scale(1)";

            updateTurnUI();
            startTimer();

            const shuffledOptions = [...targetWords].sort(() => 0.5 - Math.random()).slice(0, 3);
            if (!shuffledOptions.find(o => o.color === wordObj.color)) {
                shuffledOptions[0] = wordObj;
            }
            const finalOptions = shuffledOptions.sort(() => 0.5 - Math.random());

            optionsGrid.innerHTML = '';
            finalOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "h-36 rounded-3xl shadow-lg border-b-8 border-gray-300 active:border-b-0 active:translate-y-2 transition-all flex items-center justify-center transform hover:scale-105 p-4";
                btn.style.backgroundColor = opt.hex;
                
                if(opt.color === 'white') btn.classList.add('border-2', 'border-gray-200');
                
                btn.innerHTML = opt.icon;
                
                btn.onclick = () => {
                    if (!isProcessing) handleGuess(opt.color === wordObj.color);
                };
                optionsGrid.appendChild(btn);
            });
        }

        function updateTurnUI() {
            if (currentTurn === 'left') {
                teamLeftBox.classList.remove('opacity-40', 'scale-90');
                teamLeftBox.classList.add('scale-100', 'opacity-100');
                teamRightBox.classList.add('opacity-40', 'scale-90');
                leftStatus.innerText = "YOUR TURN!";
                rightStatus.innerText = "WAITING...";
                turnPrompt.innerText = "TEAM RED: READ!";
                turnPrompt.className = "text-red-600 font-black uppercase tracking-widest text-2xl";
                arrowSymbol.innerText = "⬅️";
                leftChars.classList.add('active-team');
                rightChars.classList.remove('active-team');
            } else {
                teamRightBox.classList.remove('opacity-40', 'scale-90');
                teamRightBox.classList.add('scale-100', 'opacity-100');
                teamLeftBox.classList.add('opacity-40', 'scale-90');
                rightStatus.innerText = "YOUR TURN!";
                leftStatus.innerText = "WAITING...";
                turnPrompt.innerText = "TEAM BLUE: READ!";
                turnPrompt.className = "text-blue-600 font-black uppercase tracking-widest text-2xl";
                arrowSymbol.innerText = "➡️";
                rightChars.classList.add('active-team');
                leftChars.classList.remove('active-team');
            }
        }

        function handleGuess(isCorrect) {
            isProcessing = true;
            clearInterval(timerInterval); 
            
            if (isCorrect) {
                challengeArea.classList.add('correct-flash');
                pullRope();
                wordDisplay.style.transform = "scale(1.2)";
                setTimeout(() => {
                    challengeArea.classList.remove('correct-flash');
                    swapTurn();
                }, 1000);
            } else {
                showMiss();
                setTimeout(() => swapTurn(), 1200);
            }
        }

        function swapTurn() {
            currentTurn = (currentTurn === 'left') ? 'right' : 'left';
            turnCount++;
            
            // Decrease timer duration every turn
            currentTurnDuration = Math.max(minTurnDuration, initialTurnDuration - (turnCount * reductionPerTurn));
            
            wordDisplay.style.opacity = "0";
            setTimeout(initRound, 300);
        }

        function pullRope() {
            if (currentTurn === 'left') {
                ropePosition += pullStrength;
            } else {
                ropePosition -= pullStrength;
            }
            updateRopeVisual();
            checkWin();
        }

        function showMiss() {
            challengeArea.classList.add('shake');
            wordDisplay.innerText = "WHOOPS!";
            wordDisplay.classList.add('text-gray-400');
            setTimeout(() => {
                challengeArea.classList.remove('shake');
                wordDisplay.classList.remove('text-gray-400');
            }, 1000);
        }

        function updateRopeVisual() {
            const shift = ropePosition * 60; 
            ropeContainer.style.transform = `translateX(${-shift}px)`;
        }

        function checkWin() {
            if (Math.abs(ropePosition) >= winThreshold) {
                clearInterval(timerInterval);
                const isRedWin = ropePosition > 0;
                winnerText.innerText = isRedWin ? "TEAM RED WINS!" : "TEAM BLUE WINS!";
                winnerText.style.color = isRedWin ? "#EF4444" : "#3B82F6";
                winOverlay.style.display = 'flex';
            }
        }

        function resetGame() {
            ropePosition = 0;
            currentTurn = 'left';
            turnCount = 0;
            currentTurnDuration = initialTurnDuration;
            winOverlay.style.display = 'none';
            updateRopeVisual();
            initRound();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { ropePosition++; updateRopeVisual(); checkWin(); }
            if (e.key === 'ArrowRight') { ropePosition--; updateRopeVisual(); checkWin(); }
        });

        window.onload = initRound;
    </script>
</body>
</html>
