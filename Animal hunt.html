<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animal Explorer: Detailed Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Press+Start+2P', cursive;
            touch-action: none;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 70vh;
            margin: 0 auto;
            border: 4px solid #fff;
            background: linear-gradient(to bottom, #87CEEB, #E0F2F1);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            z-index: 10;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            background: #222;
            padding-top: 20px;
        }

        .touch-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        .control-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            user-select: none;
            touch-action: none;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px;
            border: 8px solid #5d4037;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            max-width: 90%;
            width: 550px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .btn {
            background: #4caf50;
            color: white;
            padding: 15px 25px;
            border: none;
            border-bottom: 5px solid #388e3c;
            cursor: pointer;
            font-family: 'Press+Start+2P', cursive;
            font-size: 12px;
            margin: 10px;
        }

        .correct { background-color: #2ecc71 !important; border-bottom-color: #27ae60 !important; }
        .wrong { background-color: #e74c3c !important; border-bottom-color: #c0392b !important; }
        
        #animal-preview-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            background: #f8fafc;
            border: 4px dashed #cbd5e1;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-overlay">
        <div id="timer-display">TIME: 0.0s</div>
        <div id="coin-display" class="mt-1 text-yellow-400">GOLD: 0</div>
        <div id="score-display" class="mt-1">ANIMALS: 0/9</div>
        <div id="health-display" class="mt-1">LIVES: ❤️❤️❤️❤️❤️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-controls">
        <div class="control-group">
            <div id="left-btn" class="touch-btn">◀</div>
            <div id="right-btn" class="touch-btn">▶</div>
        </div>
        <div class="control-group">
            <div id="jump-btn" class="touch-btn">UP</div>
        </div>
    </div>

    <div id="start-screen" class="modal">
        <h1 class="text-xl mb-4 text-green-800">ANIMAL EXPEDITION</h1>
        <p class="text-[10px] leading-loose mb-6">Find the animals from the story and identify their special body parts!</p>
        <button class="btn" onclick="startGame()">BEGIN MISSION</button>
    </div>

    <div id="quiz-modal" class="modal" style="display:none;">
        <h2 id="quiz-title" class="text-lg mb-4">IDENTIFY PART</h2>
        <div id="animal-preview-container">
            <canvas id="quiz-animal-canvas" width="140" height="140"></canvas>
        </div>
        <p id="quiz-question" class="mb-6 text-sm"></p>
        <div id="options-grid" class="flex flex-col gap-3 items-center"></div>
    </div>

    <div id="win-screen" class="modal" style="display:none;">
        <h2 class="text-xl text-green-600 mb-4">EXPEDITION COMPLETE!</h2>
        <p id="final-stats" class="text-xs mb-6 leading-relaxed"></p>
        <button class="btn" onclick="location.reload()">RESTART</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const GRAVITY = 0.4;
    const JUMP_FORCE = -10;
    const SPEED = 4;

    canvas.width = 800;
    canvas.height = 400;

    let gameState = 'start';
    let score = 0;
    let coins = 0;
    let lives = 5;
    let cameraX = 0;
    let startTime = 0;
    let elapsedTime = 0;
    let frameCount = 0;

    const animals = [
        { name: 'Brown Bear', part: 'paws', color: '#704214', altColor: '#5D4037', type: 'bear' },
        { name: 'Red Bird', part: 'wings', color: '#D32F2F', altColor: '#B71C1C', type: 'bird' },
        { name: 'Yellow Duck', part: 'webbed feet', color: '#FBC02D', altColor: '#F9A825', type: 'duck' },
        { name: 'Blue Horse', part: '4 feet', color: '#1976D2', altColor: '#0D47A1', type: 'horse' },
        { name: 'Green Frog', part: 'webbed feet', color: '#388E3C', altColor: '#1B5E20', type: 'frog' },
        { name: 'Purple Cat', part: 'paws', color: '#7B1FA2', altColor: '#4A148C', type: 'cat' },
        { name: 'White Dog', part: '4 feet', color: '#F5F5F5', altColor: '#E0E0E0', type: 'dog' },
        { name: 'Black Sheep', part: '4 feet', color: '#212121', altColor: '#424242', type: 'sheep' },
        { name: 'Gold Fish', part: 'fins', color: '#FF9800', altColor: '#E65100', type: 'fish' }
    ];

    const allBodyParts = ['paws', '4 feet', 'wings', 'webbed feet', 'fins'];

    const player = {
        x: 100, y: 200, w: 32, h: 60,
        vx: 0, vy: 0, grounded: false,
        facingRight: true, walking: false
    };

    let platforms = [
        { x: 0, y: 350, w: 10000, h: 50 },
        { x: 400, y: 250, w: 200, h: 20 },
        { x: 750, y: 180, w: 200, h: 20 },
        { x: 1100, y: 260, w: 250, h: 20 },
        { x: 1500, y: 180, w: 200, h: 20 },
        { x: 1900, y: 250, w: 250, h: 20 },
        { x: 2300, y: 160, w: 200, h: 20 },
        { x: 2700, y: 250, w: 250, h: 20 },
        { x: 3100, y: 180, w: 300, h: 20 },
        { x: 3600, y: 260, w: 200, h: 20 },
        { x: 4000, y: 180, w: 300, h: 20 }
    ];

    let items = animals.map((a, i) => ({
        ...a,
        x: 500 + (i * 450),
        y: 120,
        w: 80,
        h: 80,
        collected: false
    }));

    let pickups = [];
    platforms.forEach((p, idx) => {
        if (idx === 0) return;
        const count = Math.floor(p.w / 40);
        for(let i=0; i<count; i++) {
            pickups.push({ x: p.x + (i * 40) + 10, y: p.y - 35, w: 15, h: 15, collected: false });
        }
    });

    const keys = {};
    const touchState = { left: false, right: false, jump: false };
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const setupTouchBtn = (id, key) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); touchState[key] = true; };
        const end = (e) => { e.preventDefault(); touchState[key] = false; };
        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
    };

    setupTouchBtn('left-btn', 'left');
    setupTouchBtn('right-btn', 'right');
    setupTouchBtn('jump-btn', 'jump');

    function drawAnimal(ctx, animal, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        const s = size / 100;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000';

        switch(animal.type) {
            case 'bear':
                ctx.fillStyle = animal.color;
                // Body
                ctx.beginPath(); ctx.ellipse(50*s, 65*s, 35*s, 30*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Ears
                ctx.beginPath(); ctx.arc(25*s, 30*s, 10*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(75*s, 30*s, 10*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Head
                ctx.beginPath(); ctx.arc(50*s, 50*s, 28*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Muzzle
                ctx.fillStyle = '#D7CCC8';
                ctx.beginPath(); ctx.ellipse(50*s, 60*s, 12*s, 8*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Details
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(40*s, 45*s, 3*s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(60*s, 45*s, 3*s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(50*s, 58*s, 4*s, 0, Math.PI*2); ctx.fill();
                break;

            case 'bird':
                ctx.fillStyle = animal.color;
                // Tail
                ctx.beginPath(); ctx.moveTo(20*s, 50*s); ctx.lineTo(5*s, 35*s); ctx.lineTo(5*s, 65*s); ctx.closePath(); ctx.fill(); ctx.stroke();
                // Body
                ctx.beginPath(); ctx.ellipse(45*s, 55*s, 30*s, 22*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Wing
                ctx.fillStyle = animal.altColor;
                ctx.beginPath(); ctx.ellipse(40*s, 55*s, 15*s, 8*s, 0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Head
                ctx.fillStyle = animal.color;
                ctx.beginPath(); ctx.arc(70*s, 40*s, 18*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Beak
                ctx.fillStyle = '#FFEB3B';
                ctx.beginPath(); ctx.moveTo(88*s, 38*s); ctx.lineTo(105*s, 42*s); ctx.lineTo(88*s, 46*s); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(75*s, 35*s, 2.5*s, 0, Math.PI*2); ctx.fill();
                break;

            case 'duck':
                ctx.fillStyle = animal.color;
                // Body
                ctx.beginPath(); ctx.ellipse(45*s, 65*s, 38*s, 24*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Head
                ctx.beginPath(); ctx.arc(75*s, 40*s, 20*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Beak
                ctx.fillStyle = '#FF9800';
                ctx.beginPath(); ctx.roundRect(85*s, 38*s, 18*s, 10*s, 4*s); ctx.fill(); ctx.stroke();
                // Eyes
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(80*s, 33*s, 3*s, 0, Math.PI*2); ctx.fill();
                // Wing lines
                ctx.strokeStyle = animal.altColor; ctx.beginPath(); ctx.moveTo(30*s, 60*s); ctx.lineTo(55*s, 60*s); ctx.stroke();
                break;

            case 'horse':
                ctx.fillStyle = animal.color;
                // Legs
                ctx.fillRect(25*s, 70*s, 6*s, 15*s); ctx.fillRect(60*s, 70*s, 6*s, 15*s);
                // Body
                ctx.beginPath(); ctx.roundRect(15*s, 35*s, 55*s, 35*s, 10*s); ctx.fill(); ctx.stroke();
                // Neck/Head
                ctx.save(); ctx.translate(65*s, 40*s); ctx.rotate(-Math.PI/4);
                ctx.beginPath(); ctx.roundRect(0, -15*s, 35*s, 20*s, 5*s); ctx.fill(); ctx.stroke();
                ctx.restore();
                // Mane
                ctx.fillStyle = animal.altColor; ctx.fillRect(58*s, 15*s, 6*s, 30*s);
                // Eye
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(82*s, 25*s, 2*s, 0, Math.PI*2); ctx.fill();
                break;

            case 'frog':
                ctx.fillStyle = animal.color;
                // Bulging Eyes
                ctx.beginPath(); ctx.arc(35*s, 40*s, 12*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(65*s, 40*s, 12*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Body
                ctx.beginPath(); ctx.ellipse(50*s, 65*s, 35*s, 22*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Details
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(35*s, 38*s, 5*s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(65*s, 38*s, 5*s, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.beginPath(); ctx.arc(50*s, 65*s, 15*s, 0.2, Math.PI-0.2); ctx.stroke();
                // Spots
                ctx.fillStyle = animal.altColor; ctx.beginPath(); ctx.arc(30*s, 65*s, 4*s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(70*s, 65*s, 5*s, 0, Math.PI*2); ctx.fill();
                break;

            case 'cat':
                ctx.fillStyle = animal.color;
                // Tail
                ctx.strokeStyle = animal.color; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(25*s, 70*s); ctx.quadraticCurveTo(5*s, 80*s, 5*s, 50*s); ctx.stroke();
                // Body
                ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                ctx.beginPath(); ctx.ellipse(50*s, 65*s, 28*s, 20*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Head
                ctx.beginPath(); ctx.arc(55*s, 45*s, 20*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Ears
                ctx.beginPath(); ctx.moveTo(40*s, 35*s); ctx.lineTo(35*s, 15*s); ctx.lineTo(50*s, 30*s); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(70*s, 35*s); ctx.lineTo(75*s, 15*s); ctx.lineTo(60*s, 30*s); ctx.fill(); ctx.stroke();
                // Face
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(60*s, 48*s, 2.5*s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(50*s, 48*s, 2.5*s, 0, Math.PI*2); ctx.fill();
                // Whiskers
                ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(65*s, 52*s); ctx.lineTo(85*s, 50*s); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(65*s, 55*s); ctx.lineTo(85*s, 58*s); ctx.stroke();
                break;

            case 'dog':
                ctx.fillStyle = animal.color;
                // Legs
                ctx.fillRect(25*s, 70*s, 6*s, 15*s); ctx.fillRect(55*s, 70*s, 6*s, 15*s);
                // Body
                ctx.beginPath(); ctx.roundRect(20*s, 40*s, 45*s, 32*s, 8*s); ctx.fill(); ctx.stroke();
                // Head
                ctx.beginPath(); ctx.arc(70*s, 45*s, 18*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Ear (Floppy)
                ctx.fillStyle = animal.altColor;
                ctx.beginPath(); ctx.ellipse(62*s, 42*s, 14*s, 6*s, Math.PI/2.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Nose
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(85*s, 48*s, 3.5*s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(75*s, 42*s, 2.5*s, 0, Math.PI*2); ctx.fill();
                break;

            case 'sheep':
                // Fluffy wool layers
                ctx.fillStyle = animal.color;
                ctx.strokeStyle = '#444';
                const segments = 10;
                for(let i=0; i<segments; i++) {
                    const ang = (i / segments) * Math.PI * 2;
                    ctx.beginPath(); ctx.arc(50*s + Math.cos(ang)*22*s, 60*s + Math.sin(ang)*18*s, 16*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                }
                // Face
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.ellipse(75*s, 55*s, 14*s, 10*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Eye
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(82*s, 52*s, 2.5*s, 0, Math.PI*2); ctx.fill();
                // Ears
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.ellipse(65*s, 50*s, 8*s, 4*s, -0.5, 0, Math.PI*2); ctx.fill();
                break;

            case 'fish':
                ctx.fillStyle = animal.color;
                // Tail fin
                ctx.beginPath(); ctx.moveTo(20*s, 50*s); ctx.lineTo(0, 30*s); ctx.lineTo(0, 70*s); ctx.closePath(); ctx.fill(); ctx.stroke();
                // Body
                ctx.beginPath(); ctx.ellipse(50*s, 50*s, 38*s, 22*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                // Scales (texture)
                ctx.strokeStyle = animal.altColor;
                for(let i=0; i<3; i++) {
                    ctx.beginPath(); ctx.arc(45*s + i*8*s, 50*s, 10*s, -0.5, 0.5); ctx.stroke();
                }
                // Dorsal fin
                ctx.fillStyle = animal.altColor;
                ctx.beginPath(); ctx.moveTo(40*s, 30*s); ctx.quadraticCurveTo(55*s, 10*s, 70*s, 30*s); ctx.closePath(); ctx.fill(); ctx.stroke();
                // Eye
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(75*s, 45*s, 5*s, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(77*s, 45*s, 2.5*s, 0, Math.PI*2); ctx.fill();
                break;
        }
        ctx.restore();
    }

    function drawPerson(ctx, p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        if (!p.facingRight) { ctx.scale(-1, 1); ctx.translate(-p.w, 0); }
        const legSwing = p.walking ? Math.sin(frameCount * 0.2) * 8 : 0;
        
        // Backpack
        ctx.fillStyle = '#5D4037'; ctx.fillRect(-4, 20, 10, 20);
        // Legs
        ctx.fillStyle = '#37474F';
        ctx.fillRect(4, 42, 8, 18 + legSwing); ctx.fillRect(20, 42, 8, 18 - legSwing);
        // Body (Shirt)
        ctx.fillStyle = '#F4511E'; ctx.fillRect(0, 18, 32, 26);
        // Head
        ctx.fillStyle = '#FFE0B2'; ctx.fillRect(6, 0, 20, 20);
        // Hat
        ctx.fillStyle = '#FFB300'; ctx.fillRect(2, 0, 28, 6); ctx.fillRect(2, -4, 20, 4);
        // Eye
        ctx.fillStyle = '#000'; ctx.fillRect(20, 6, 4, 4);
        ctx.restore();
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        gameState = 'playing';
        startTime = performance.now();
        gameLoop();
    }

    function showQuiz(animal) {
        gameState = 'quiz';
        const modal = document.getElementById('quiz-modal');
        const question = document.getElementById('quiz-question');
        const optionsGrid = document.getElementById('options-grid');
        
        const qCanvas = document.getElementById('quiz-animal-canvas');
        const qctx = qCanvas.getContext('2d');
        qctx.clearRect(0, 0, 140, 140);
        drawAnimal(qctx, animal, 20, 20, 100);

        modal.style.display = 'block';
        question.innerHTML = `Which part helps the <span style="color:${animal.color}">${animal.name}</span> move?`;
        
        const choices = [animal.part, ...allBodyParts.filter(p => p !== animal.part).sort(() => Math.random() - 0.5).slice(0, 2)].sort(() => Math.random() - 0.5);

        optionsGrid.innerHTML = '';
        choices.forEach(part => {
            const btn = document.createElement('button');
            btn.className = 'btn w-full';
            btn.innerText = part.toUpperCase();
            btn.onclick = () => {
                if (part === animal.part) {
                    btn.classList.add('correct');
                    coins += 100;
                    setTimeout(() => {
                        modal.style.display = 'none';
                        score++;
                        document.getElementById('score-display').innerText = `ANIMALS: ${score}/9`;
                        gameState = 'playing';
                        if (score === 9) showWinScreen();
                    }, 600);
                } else {
                    btn.classList.add('wrong');
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) location.reload();
                }
            };
            optionsGrid.appendChild(btn);
        });
    }

    function updateLivesUI() {
        let h = ''; for(let i=0; i<5; i++) h += i < lives ? '❤️' : '🖤';
        document.getElementById('health-display').innerText = `LIVES: ${h}`;
    }

    function showWinScreen() {
        gameState = 'win';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('final-stats').innerHTML = `TIME: ${(elapsedTime/1000).toFixed(1)}s<br>GOLD: ${coins}<br>All Species Documented!`;
    }

    function update(timestamp) {
        if (gameState !== 'playing') return;
        elapsedTime = timestamp - startTime;
        document.getElementById('timer-display').innerText = `TIME: ${(elapsedTime / 1000).toFixed(1)}s`;
        frameCount++;

        player.walking = false;
        if (keys['ArrowLeft'] || keys['KeyA'] || touchState.left) { player.vx = -SPEED; player.facingRight = false; player.walking = true; }
        else if (keys['ArrowRight'] || keys['KeyD'] || touchState.right) { player.vx = SPEED; player.facingRight = true; player.walking = true; }
        else player.vx *= 0.8;

        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || touchState.jump) && player.grounded) {
            player.vy = JUMP_FORCE; player.grounded = false;
        }

        player.vy += GRAVITY;
        player.x += player.vx;
        player.y += player.vy;
        if (player.x < 0) player.x = 0;

        player.grounded = false;
        platforms.forEach(p => {
            if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                if (player.vy > 0 && player.y + player.h - player.vy <= p.y) {
                    player.y = p.y - player.h; player.vy = 0; player.grounded = true;
                }
            }
        });

        items.forEach(item => {
            if (!item.collected && player.x < item.x + item.w && player.x + player.w > item.x && player.y < item.y + item.h && player.y + player.h > item.y) {
                item.collected = true; showQuiz(item);
            }
        });

        pickups.forEach(p => {
            if (!p.collected && player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                p.collected = true; coins += 10; document.getElementById('coin-display').innerText = `GOLD: ${coins}`;
            }
        });

        if (player.x > canvas.width / 2) cameraX = player.x - canvas.width / 2;
        if (player.y > canvas.height) { player.x = cameraX + 50; player.y = 100; player.vy = 0; lives--; updateLivesUI(); if (lives <= 0) location.reload(); }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-cameraX, 0);

        // Backdrop hills
        ctx.fillStyle = '#66BB6A';
        for(let i=0; i<10; i++) {
            ctx.beginPath(); ctx.arc(i*800, 450, 400, 0, Math.PI*2); ctx.fill();
        }

        platforms.forEach(p => {
            ctx.fillStyle = '#5d4037'; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#2e7d32'; ctx.fillRect(p.x, p.y, p.w, 6);
        });

        pickups.forEach(p => {
            if (!p.collected) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.arc(p.x + 7.5, p.y + 7.5 + Math.sin(frameCount/10)*3, 7.5, 0, Math.PI*2); ctx.fill();
            }
        });

        items.forEach(item => {
            if (!item.collected) {
                drawAnimal(ctx, item, item.x, item.y + Math.sin(Date.now()/400)*8, 80);
                // Glow effect
                ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
                ctx.strokeRect(item.x-5, item.y-5, 90, 90);
            }
        });

        drawPerson(ctx, player);
        ctx.restore();
    }

    function gameLoop(timestamp) {
        update(timestamp);
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
